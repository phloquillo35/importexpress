name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality (typecheck + lint + tests)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/railway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

  e2e:
    name: E2E (Playwright + Postgres)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/railway
      NEXTAUTH_URL: http://localhost:3000
      # Las pruebas salen todas de la misma IP y agotarían el límite de 60 pedidos por minuto (429).
      DISABLE_RATE_LIMIT: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: railway
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Se arma el esquema desde schema.prisma y no con `prisma migrate deploy`: el historial de migraciones
      # no se puede reproducir sobre una base vacía (las primeras crean "Product", "Order"... con mayúscula
      # y el esquema mapea a "product", "order"... en minúscula, así que 20260904000000 falla). La base de
      # producción ya está migrada y no se toca. Para volver a probar migraciones, hace falta una migración
      # base (baseline) que parta del esquema actual.
      - name: Create schema
        run: npx prisma db push

      - name: Seed CI data
        run: npx tsx prisma/seed-ci.ts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build Next.js
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7